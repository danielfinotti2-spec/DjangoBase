{% extends 'cadastro/base.html' %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
    <section class="painel formulario-painel">
        <p class="sobretitulo">Área restrita</p>
        <h1>Entrar</h1>
        {% if form.errors %}<p class="erro-campo">Usuário ou senha inválidos. Tente novamente.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% for field in form %}
                <div class="grupo-campo">
                    <label for="{{ field.id_for_label }}">{% if field.name == 'username' %}Usuário{% else %}Senha{% endif %}</label>
                    {{ field }}
                </div>
                <button class="botao" type="submit">Esqueceu a senha?</button>
            {% endfor %}
            <button class="botao primario" type="submit">Entrar</button>
        </form>
    </section>
{% endblock %}
