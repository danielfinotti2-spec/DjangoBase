<p>Informe o e-mail associado à sua conta. Enviaremos um link para redefinir a senha.</p>
{% if form.errors %}<p>Confira o e-mail informado.</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <div>
        <label for="{{ form.email.id_for_label }}">E-mail</label>
        {{ form.email }}
        {% for error in form.email.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
    <button type="submit">Enviar link</button>
</form>
