{% extends 'cadastro/base.html' %}

{% block titulo %}Excluir {{ pessoa.nome }}{% endblock %}

{% block conteudo %}
    <section class="painel">
        <p class="sobretitulo">Confirmação</p>
        <h1>Excluir cadastro?</h1>
        <p>Tem certeza de que deseja excluir <strong>{{ pessoa.nome }}</strong>? Esta ação não pode ser desfeita.</p>
        <form method="post" class="acoes">
            {% csrf_token %}
            <button class="botao perigo" type="submit">Sim, excluir</button>
            <a class="botao discreto" href="{% url 'detalhe' pessoa.id %}">Cancelar</a>
        </form>
    </section>
{% endblock %}
