{% extends 'cadastro/base.html' %}

{% block titulo %}Excluir {{ pessoa.nome }}{% endblock %}

{% block conteudo %}
    <section>
        <p>Confirmação</p>
        <h1>Excluir cadastro?</h1>
        <p>Tem certeza de que deseja excluir <strong>{{ pessoa.nome }}</strong>? Esta ação não pode ser desfeita.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Sim, excluir</button>
            <a href="{% url 'detalhe' pessoa.id %}">Cancelar</a>
        </form>
    </section>
{% endblock %}
